<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階動態漸層背景</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        .gradient-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .gradient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.8;
        }

        .blob1 {
            width: 60%;
            height: 60%;
            background: linear-gradient(45deg, #ff0000, #ffa500);
            top: 20%;
            left: 10%;
            animation: move1 20s ease-in-out infinite alternate;
        }

        .blob2 {
            width: 50%;
            height: 50%;
            background: linear-gradient(135deg, #ffff00, #008000);
            top: 30%;
            left: 40%;
            animation: move2 25s ease-in-out infinite alternate;
        }

        .blob3 {
            width: 45%;
            height: 45%;
            background: linear-gradient(225deg, #0000ff, #4b0082);
            top: 10%;
            left: 60%;
            animation: move3 18s ease-in-out infinite alternate;
        }

        @keyframes move1 {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(20%, 15%) scale(1.2);
            }
        }

        @keyframes move2 {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-15%, 10%) scale(1.1);
            }
        }

        @keyframes move3 {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-5%, 25%) scale(1.15);
            }
        }

        .content {
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
        }

        p {
            font-size: 1.4rem;
        }
    </style>
</head>
<body>
<div class="gradient-container">
    <div class="gradient-blob blob1"></div>
    <div class="gradient-blob blob2"></div>
    <div class="gradient-blob blob3"></div>
</div>
<div class="content">
    <h1>進階動態漸層背景</h1>
    <p>這是一個使用模糊效果和多層動畫的高級漸層背景</p>
</div>
</body>
</html>
